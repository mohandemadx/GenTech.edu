<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | GenTech Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-blue-50 text-[#0f2f68] flex items-center justify-center p-6">
  <main class="w-full max-w-lg rounded-2xl border border-blue-100 bg-white p-8 text-center shadow-sm">
    <p class="text-sm font-bold uppercase tracking-[.18em] text-blue-600">Request not completed</p>
    <h1 class="mt-3 text-2xl font-black">{{ title }}</h1>
    <p class="mt-3 text-slate-600">{{ message }}</p>
    <a href="{{ url_for('login') }}" class="mt-6 inline-flex rounded-lg bg-blue-700 px-5 py-3 font-semibold text-white hover:bg-blue-800">Return to sign in</a>
  </main>
</body>
</html>
